port: 7890
socks-port: 7891
redir-port: 7892
mixed-port: 7893
tproxy-port: 7895
authentication: ['mihomo:mihomo']
skip-auth-prefixes: [192.168.1.0/24, 192.168.31.0/24, 192.168.100.0/24, 127.0.0.1/8]
allow-lan: true
mode: rule
log-level: warning
ipv6: true
keep-alive-interval: 1800
keep-alive-idle: 600
find-process-mode: strict
external-ui-url: https://github.com/Zephyruso/zashboard/releases/latest/download/dist.zip
external-ui-name: zashboard
external-ui: ui
external-controller: 127.0.0.1:9090
profile:
  store-selected: true
  store-fake-ip: true
unified-delay: true
tcp-concurrent: true
global-client-fingerprint: random
global-ua: FFFFFFFFF
tun:
  enable: false
  stack: mixed
  device: utun-mihomo
  auto-route: true
  auto-redirect: true
  auto-detect-interface: true
  strict-route: true
  endpoint-independent-nat: true
  dns-hijack: ['any:53', 'tcp://any:53']
dns:
  enable: true
  ipv6: true
  use-hosts: true
  use-system-hosts: true
  enhanced-mode: redir-host
  respect-rules: true
  default-nameserver: ['udp://114.114.114.114', 'udp://114.114.115.115', 'udp://1.2.4.8', 'udp://1.8.8.8', 'udp://[2620:0:ccc::2]', 'udp://[2620:0:ccd::2]', 'udp://[2402:4e00::]', 'udp://[2400:3200::1]', 'quic://223.5.5.5', 'quic://[2400:3200::1]', 'tls://1.12.12.12', 'tls://120.53.53.53', 'https://223.5.5.5/dns-query', 'https://223.6.6.6/dns-query']
  proxy-server-nameserver: ['quic://dns.alidns.com', 'https://dns.alidns.com/dns-query#h3=true', 'tls://dns.alidns.com', 'https://doh.pub/dns-query', 'tls://dot.pub']
  direct-nameserver: ['quic://dns.alidns.com', 'https://dns.alidns.com/dns-query#h3=true', 'tls://dns.alidns.com', 'https://doh.pub/dns-query', 'tls://dot.pub']
  nameserver: ['https://cloudflare-dns.com/dns-query#DNS', 'tls://one.one.one.one#DNS', 'https://dns.google/dns-query#DNS', 'tls://dns.google#DNS']
hosts:
  miwifi.com: 192.168.31.1
  dns.alidns.com: [223.5.5.5, 223.6.6.6, '2400:3200::1', '2400:3200:baba::1']
  doh.pub: [1.12.12.12, 1.12.12.21, 120.53.53.53]
  dns.google: [8.8.8.8, 8.8.4.4, '2001:4860:4860::8888', '2001:4860:4860::8844']
  cloudflare-dns.com: [1.1.1.1, 1.0.0.1, '2606:4700:4700::1111', '2606:4700:4700::1001']
sniffer:
  enable: true
  sniff:
    QUIC:
      ports: [443]
    TLS:
      ports: [443, 8443]
    HTTP:
      ports: [80, 8080-8880]
      override-destination: true
  force-domain: [+.netflix.com, +.nflxvideo.net, +.amazonaws.com, +.media.dssott.com]
  skip-domain: [+.apple.com, Mijia Cloud, dlg.io.mi.com, +.oray.com, +.sunlogin.net, +.push.apple.com]
