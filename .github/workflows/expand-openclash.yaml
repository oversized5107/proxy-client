name: Expand OpenClash anchors

on:
  push:
    branches:
      - main
    paths:
      - clash/profiles/openclash.src.yaml
      - scripts/expand_yaml_anchors.py
      - .github/workflows/expand-openclash.yaml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  expand-openclash:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install YAML dependency
        run: python -m pip install PyYAML

      - name: Expand OpenClash anchors
        run: python scripts/expand_yaml_anchors.py openclash

      - name: Commit generated config
        run: |
          git add clash/generated/openclash.yaml

          if git diff --cached --quiet -- clash/generated/openclash.yaml; then
            echo "No generated changes."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: expand openclash anchors [skip ci]"
          git push
